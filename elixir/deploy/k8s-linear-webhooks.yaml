apiVersion: v1
kind: Namespace
metadata:
  name: symphony
---
apiVersion: v1
kind: Service
metadata:
  name: symphony-shopify-draft-proxy-webhook
  namespace: symphony
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 4312
---
apiVersion: v1
kind: Endpoints
metadata:
  name: symphony-shopify-draft-proxy-webhook
  namespace: symphony
subsets:
  - addresses:
      - ip: 100.112.166.29
    ports:
      - name: http
        port: 4312
        protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: symphony-shot-caller-webhook
  namespace: symphony
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 4314
---
apiVersion: v1
kind: Endpoints
metadata:
  name: symphony-shot-caller-webhook
  namespace: symphony
subsets:
  - addresses:
      - ip: 100.112.166.29
    ports:
      - name: http
        port: 4314
        protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: symphony-linear-webhooks
  namespace: symphony
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - linear-shopify-draft-proxy.shot-caller.win
      secretName: linear-shopify-draft-proxy-tls
    - hosts:
        - linear-shot-caller.shot-caller.win
      secretName: linear-shot-caller-tls
  rules:
    - host: linear-shopify-draft-proxy.shot-caller.win
      http:
        paths:
          - path: /api/v1/linear/webhook
            pathType: Exact
            backend:
              service:
                name: symphony-shopify-draft-proxy-webhook
                port:
                  name: http
    - host: linear-shot-caller.shot-caller.win
      http:
        paths:
          - path: /api/v1/linear/webhook
            pathType: Exact
            backend:
              service:
                name: symphony-shot-caller-webhook
                port:
                  name: http
